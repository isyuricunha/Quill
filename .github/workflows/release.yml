name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests
        shell: pwsh
        run: |
          python -m compileall -q core app ui main.py
          if ($LASTEXITCODE -ne 0) {
            throw "Python source compilation failed with exit code $LASTEXITCODE."
          }

          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) {
            throw "Unit tests failed with exit code $LASTEXITCODE."
          }

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $latestTag = git tag --list "v[0-9]*" --sort=-v:refname | Select-Object -First 1

          if ($latestTag) {
            $baseVersion = $latestTag.TrimStart('v')
            $baseRef = $latestTag
          } else {
            # The upstream project released v1.0.8 from this commit before the fork.
            $baseVersion = "1.0.8"
            $baseRef = "9afb09c43dc68720dfa177b14973c1e50f2e3909"
          }

          $messages = (git log "$baseRef..HEAD" --format="%B" | Out-String)

          $bump = "none"
          if ($messages -match '(?im)^[a-z]+(?:\([^)]+\))?!:' -or $messages -match '(?im)^BREAKING CHANGE:') {
            $bump = "major"
          } elseif ($messages -match '(?im)^feat(?:\([^)]+\))?:') {
            $bump = "minor"
          } elseif ($messages -match '(?im)^(fix|perf|refactor)(?:\([^)]+\))?:') {
            $bump = "patch"
          }

          if ($bump -eq "none") {
            "should_release=false" >> $env:GITHUB_OUTPUT
            "base_ref=$baseRef" >> $env:GITHUB_OUTPUT
            Write-Host "No releasable Conventional Commit found."
            exit 0
          }

          $parts = $baseVersion.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          switch ($bump) {
            "major" {
              $major++
              $minor = 0
              $patch = 0
            }
            "minor" {
              $minor++
              $patch = 0
            }
            "patch" {
              $patch++
            }
          }

          $tag = "v$major.$minor.$patch"
          "should_release=true" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$major.$minor.$patch" >> $env:GITHUB_OUTPUT
          "base_ref=$baseRef" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $tag ($bump bump from v$baseVersion)"

      - name: Embed release version
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          Set-Content -Path "resources/version.txt" -Value "${{ steps.version.outputs.version }}" -NoNewline -Encoding utf8
          Write-Host "Embedded Quill version ${{ steps.version.outputs.version }}"

      - name: Install Python dependencies
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Quill
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: python build.py

      - name: Smoke test packaged executable
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\Quill\Quill.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged Quill.exe smoke test failed with exit code $($process.ExitCode)."
          }
          Write-Host "Packaged Quill.exe smoke test passed."

      - name: Package portable build
        if: steps.version.outputs.should_release == 'true'
        id: portable
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $portable = "Quill-$tag-portable-windows-x64.zip"
          Compress-Archive -Path "dist\Quill\*" -DestinationPath $portable -Force
          "file=$portable" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: steps.version.outputs.should_release == 'true'
        id: installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }

          & $iscc "/DAppVersion=$version" "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $installer = "Quill-v$version-setup-windows-x64.exe"
          $installerPath = Join-Path "installer-output" $installer
          if (-not (Test-Path $installerPath)) {
            throw "Installer was not created at $installerPath"
          }

          "file=$installerPath" >> $env:GITHUB_OUTPUT

      - name: Create release notes
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $baseRef = "${{ steps.version.outputs.base_ref }}"
          $changes = git log "$baseRef..HEAD" --pretty=format:"- %s"

          @"
          ## Quill $tag

          ### Changes
          $($changes -join "`n")

          ### Downloads
          - **Installer:** `Quill-$tag-setup-windows-x64.exe`
          - **Portable:** `Quill-$tag-portable-windows-x64.zip`

          The installer uses a per-user installation and does not require administrator privileges.
          The portable build can be extracted anywhere and run directly with `Quill.exe`.

          ### Requirements
          - Windows 10/11 64-bit
          "@ | Set-Content -Path release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $portable = "${{ steps.portable.outputs.file }}"
          $installer = "${{ steps.installer.outputs.file }}"
          gh release create $tag $portable $installer --title "Quill $tag" --notes-file release-notes.md --target "${{ github.sha }}"
